spring:
  application:
    name: lingora
  jackson:
    # Absent optional fields are omitted, matching the non-required properties of the OpenAPI schemas.
    default-property-inclusion: non_null
  datasource:
    url: ${LINGORA_DB_URL:jdbc:postgresql://localhost:5433/lingora}
    username: ${LINGORA_DB_USER:lingora}
    password: ${LINGORA_DB_PASSWORD:lingora}
  servlet:
    multipart:
      # Backup imports (POST /api/profile/import); the importer checks lingora.backup limits as well.
      max-file-size: ${lingora.backup.max-archive-size}
      max-request-size: 21MB
  mail:
    # Local default: Mailpit of docker-compose.yml. A real server needs SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD too.
    host: ${LINGORA_MAIL_HOST:localhost}
    port: ${LINGORA_MAIL_PORT:1025}
    properties:
      "[mail.smtp.auth]": ${LINGORA_MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${LINGORA_MAIL_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
  session:
    jdbc:
      # The tables are created by Flyway (V2__spring_session.sql).
      initialize-schema: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Jackson 2 is on the classpath too (via springdoc); JSON columns use Jackson 3 like the rest of the app.
        type.json_format_mapper: jackson3
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true

server:
  # Behind a reverse proxy on the same host (e.g. Caddy) set "native", so that throttling sees the client addresses.
  forward-headers-strategy: ${LINGORA_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      timeout: 7d
      cookie:
        name: LINGORA_SESSION
        http-only: true
        same-site: lax
        secure: ${LINGORA_COOKIE_SECURE:false}
        max-age: 7d

management:
  health:
    mail:
      # An unreachable SMTP server delays account mails but does not make the app unhealthy.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  # Public on purpose: the spec holds no data and the frontend client is generated from it.
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    csrf:
      enabled: true

lingora:
  engine: rule-based
  plan:
    periodic-revision:
      # Daily check of the "every 7 learning days" revision (PRD F3); "-" switches it off.
      cron: ${LINGORA_PLAN_REVISION_CRON:0 30 3 * * *}
      zone: Europe/Zurich
  backup:
    max-archive-size: 20MB
    max-unpacked-size: 100MB
  content:
    path: ${LINGORA_CONTENT_PATH:../content}
    seed-on-startup: true
  # Base of the links in account mails (pages /verify-email and /reset-password of the web app).
  public-url: ${LINGORA_PUBLIC_URL:http://localhost:5173}
  mail:
    from: ${LINGORA_MAIL_FROM:Lingora <noreply@lingora.local>}
  registration:
    # open, invite (needs the invite code) or closed
    mode: ${LINGORA_REGISTRATION_MODE:open}
    invite-code: ${LINGORA_REGISTRATION_INVITE_CODE:}
  push:
    # Web push for the reminders; off without both keys. A new pair: ./gradlew generateVapidKeys
    public-key: ${LINGORA_PUSH_PUBLIC_KEY:}
    private-key: ${LINGORA_PUSH_PRIVATE_KEY:}
    # Contact for the push services, a mailto: or https: URL (Apple refuses others)
    subject: ${LINGORA_PUSH_SUBJECT:${lingora.public-url}}
    # Push services that subscriptions may point to (Chrome/Edge/Opera/Samsung, Firefox, Safari, legacy Edge)
    endpoint-hosts: ${LINGORA_PUSH_ENDPOINT_HOSTS:fcm.googleapis.com,push.services.mozilla.com,push.apple.com,notify.windows.com}
  reminders:
    # Looks for due reminders every 5 minutes; "-" switches the reminders off.
    cron: ${LINGORA_REMINDER_CRON:0 */5 * * * *}
