name: lumastar

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LUMASTAR_DB_NAME:-lumastar}
      POSTGRES_USER: ${LUMASTAR_DB_USER:-lumastar}
      POSTGRES_PASSWORD: ${LUMASTAR_DB_PASSWORD:-lumastar}
    ports:
      - "${LUMASTAR_DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 images keep versioned data below /var/lib/postgresql
      - lumastar-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mail:
    # Local mail catcher for development: SMTP on 1025, web UI on http://localhost:8025
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LUMASTAR_MAIL_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${LUMASTAR_MAIL_UI_PORT:-8025}:8025"

volumes:
  lumastar-db:
